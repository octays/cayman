[package]
name = "cayman"
version = "0.1.0"
edition = "2024"
description = "Secure file transfer and incremental synchronization foundations"

[dependencies]
aes-gcm = "0.10.3"
clap = { version = "4.6", features = ["derive"] }
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "time", "net"] }
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
getrandom = "0.4"
subtle = "2"
tempfile = "3"
crypto-bigint = "0.5.5"
num-bigint = "0.4.8"
ring = "0.17"
spake2 = { path = "vendor/spake2", version = "=0.4.0", features = ["std"] }
curve25519-dalek = "4"

[profile.release]
lto = true
codegen-units = 1
strip = true
