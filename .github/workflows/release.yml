name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and packaging tools
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add "$TARGET"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools upx-ucl
            target_key=${TARGET//-/_}
            echo "CC_${target_key}=musl-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_${target_key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            choco install upx -y --no-progress
          else
            brew install upx
          fi
      - name: Validate and build
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/package-release.sh
          if [[ "$RUNNER_OS" != Windows ]]; then python3 scripts/test-install.py; fi
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked --lib watch_reconnects_after_transport_is_cut -- --ignored
          if [[ "$RUNNER_OS" != Windows ]]; then
            cargo test --locked --test remote_cli -- --ignored --skip actual_go_croc_relay_transfers_and_rejects_wrong_password
          fi
          cargo build --locked --release --target "$TARGET"
      - name: Compress and package
        shell: bash
        run: bash scripts/package-release.sh "$TARGET" "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: cayman-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --generate-notes --draft)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
